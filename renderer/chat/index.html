<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>TwitchDual — Chat</title>
  <link rel="stylesheet" href="../themes/cozy/farben.css" />
  <link rel="stylesheet" href="../themes/cozy/raum.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="head" class="rahmen-leiste-chat">
    <span id="title">Chat</span>
    <span id="mode"></span>
    <button id="settings-btn" class="pixel-knopf k-zahnrad" title="Chat-Einstellungen">⚙</button>
    <div id="win-controls">
      <button id="win-min" class="pixel-knopf k-min" title="Minimieren">─</button>
      <button id="win-max" class="pixel-knopf k-max" title="Maximieren/Wiederherstellen">▢</button>
      <button id="win-close" class="pixel-knopf k-zu" title="Schließen">✕</button>
    </div>
  </div>
  <!-- Szenen-Streifen aus dem Raum; das Schild zeigt LIVE/VOD (body.onair). -->
  <div id="szene">
    <div id="onair-bar">
      <span class="lampe rot"></span>
      <span id="oa-label"></span>
    </div>
  </div>
  <div id="settings-pop" class="hidden">
    <!-- Reiter: Chat / Mehr. -->
    <div id="opt-reiter" class="opt-reiter" role="tablist">
      <button type="button" role="tab" data-reiter="chat">💬 Chat</button>
      <button type="button" role="tab" data-reiter="mehr">🛠 Mehr</button>
    </div>

    <div class="opt-seite" data-seite="chat">
      <div class="opt-group">
        <label class="opt-check"><input type="checkbox" id="opt-ts" checked />
          <span class="opt-text">Zeitstempel<small>Uhrzeit vor jeder Nachricht</small></span></label>
        <label class="opt-check"><input type="checkbox" id="opt-badges" checked />
          <span class="opt-text">Abzeichen vor Namen<small>Mod, Abo, VIP, 7TV …</small></span></label>
        <label id="opt-font-row" class="opt-row">Schriftgröße
          <input type="range" id="opt-font" min="11" max="22" step="1" />
          <span id="opt-font-val"></span>
        </label>
      </div>
      <div class="opt-group">
        <label class="opt-alpha-row opt-row"><span class="opt-text">Chat-Deckkraft<small>weniger = Desktop scheint durch</small></span>
          <input type="range" id="opt-alpha-chat" min="0" max="100" step="5" value="100" />
          <span id="opt-alpha-chat-val" class="opt-alpha-val">100%</span>
        </label>
        <label class="opt-check"><input type="checkbox" id="opt-animationen" checked /><span class="opt-text">Animationen<small>Bewegung im Hintergrund</small></span></label>
      </div>
    </div>

    <div class="opt-seite" data-seite="mehr">
      <div class="opt-group">
        <div class="opt-group-title">Diagnose</div>
        <label class="opt-check"><input type="checkbox" id="opt-diag" />
          <span class="opt-text">Protokoll mitschreiben<small>hilft bei der Fehlersuche, bleibt auf deinem PC</small></span></label>
        <button id="opt-diag-open" type="button">Diagnose-Ordner öffnen</button>
      </div>
      <div class="opt-group">
        <div class="opt-group-title">Ausprobieren</div>
        <div id="opt-fx-test" class="opt-fx-test">
          <button type="button" data-art="kiste">🎁 Kiste</button>
          <button type="button" data-art="punkte">✨ Punkte</button>
          <button type="button" data-art="raid">🚀 Raid</button>
          <button type="button" data-art="abo">⭐ Abo</button>
        </div>
        <div class="opt-hinweis">Spielt das Ereignis mit Beispieldaten ab.</div>
      </div>
    </div>
  </div>
  <!-- Pin/Umfrage/Vorhersage schweben ueber dem Chat (Schleier laeuft bis oben). -->
  <div id="chat-mitte">
    <div id="kanal-ereignisse"></div>
    <div id="messages"></div>
  </div>
  <div id="composer">
    <button id="new-msgs" class="hidden">↓ neue Nachrichten</button>
    <!-- Slow-Mode & Co.: duenner Streifen ueber dem Feld, nur wenn aktiv. -->
    <div id="room-state" class="hidden"></div>
    <!-- Ein Feld: Eingabe links, Knoepfe als kleine Symbole rechts darin. -->
    <div id="chat-feld" class="rahmen-feld">
      <div id="chat-input" contenteditable="false" data-placeholder="Zum Chatten anmelden"></div>
      <button id="emote-btn" type="button" title="Emotes" aria-label="Emotes" disabled><img class="pixel-symbol" src="../themes/cozy/symbol-smiley.png" alt=""></button>
      <button id="rewards-btn" type="button" title="Belohnungen" aria-label="Belohnungen"><img class="pixel-symbol" src="../themes/cozy/symbol-truhe.png" alt=""></button>
      <button id="chat-send" type="button" title="Senden (Enter)" aria-label="Senden" disabled><img class="pixel-symbol" src="../themes/cozy/symbol-flieger.png" alt=""></button>
    </div>
    <div id="chat-error" class="hidden"></div>
    <!-- Ergebnis einer Belohnungs-Einloesung. Geschwister von #rewards-panel,
         damit ein Neuaufbau des Panels die Meldung nicht mitreisst. Eigenes
         Element statt #chat-error: das gehoert den Sendefehlern. -->
    <div id="redeem-status" class="hidden"></div>
    <div id="emote-panel" class="hidden">
      <input id="ep-suche" type="search" placeholder="Emote suchen…" autocomplete="off" spellcheck="false" />
      <div class="ep-section">Channel</div>
      <div id="ep-channel" class="ep-grid"></div>
      <div class="ep-section">Deine Emotes</div>
      <div id="ep-user" class="ep-grid"></div>
    </div>
    <div id="rewards-panel" class="hidden"></div>
    <div id="ac-bar" class="hidden"></div>
  </div>
  <div id="emote-tip" class="hidden">
    <img id="emote-tip-img" alt="" />
    <div id="emote-tip-name"></div>
    <div id="emote-tip-src"></div>
  </div>
  <div id="user-card" class="hidden">
    <div id="uc-head">
      <span id="uc-badges"></span>
      <span id="uc-name"></span>
      <button id="uc-copy" title="Name kopieren">📋</button>
    </div>
    <div id="uc-msgs"></div>
  </div>
  <div id="footer">
    <span id="conn">nicht verbunden</span>
    <span id="points-wrap">
      <span id="points-chip" class="hidden" title="Kanalpunkte">
        <span id="zuschauer-auge" class="hidden" title="Twitch zählt dich als Zuschauer" aria-label="Twitch zählt dich als Zuschauer">👁</span>
        <img id="points-icon" class="hidden" alt="" />
        <!-- Letzte Rueckfallebene: bewusst KEIN Netzbild. Eine Ebene, die
             selbst an einem fremden CDN haengt, kann genau den Fehler haben,
             den sie abfangen soll. Erbt ueber currentColor die Akzentfarbe. -->
        <svg id="points-svg" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="8" cy="8" r="2.6" fill="currentColor" />
        </svg>
        <span id="points-value"></span>
      </span>
      <!-- Geschwister, nicht Kind: als Kind wuerde jedes Schreiben in den
           Chip die Animation mitreissen. -->
      <span id="points-gain" class="hidden" aria-hidden="true"></span>
    </span>
    <span id="rate"></span>
  </div>

  <script src="../lib/emote-text.js"></script>
  <script src="../lib/irc.js"></script>
  <script src="../lib/badges.js"></script>
  <script src="../lib/backoff.js"></script>
  <script src="../lib/vod-replay.js"></script>
  <script src="../lib/chat-ui.js"></script>
  <script src="../lib/theme.js"></script>
  <script src="../lib/kiste.js"></script>
  <script src="../lib/chat-ereignisse.js"></script>
  <script src="../lib/kanal-ereignisse.js"></script>
  <script src="../lib/teiler.js"></script>
  <script src="../lib/szene.js"></script>
  <script src="../lib/scroll-pille.js"></script>
  <script src="../lib/vorhersage-statistik.js"></script>
  <script src="vorhersage-karte.js"></script>
  <script src="ereignis-karten.js"></script>
  <script src="ereignis-setzen.js"></script>
  <script src="chat.js"></script>
</body>
</html>
