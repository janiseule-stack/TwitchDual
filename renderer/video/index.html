<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>TwitchDual — Video</title>
  <link rel="stylesheet" href="../themes/cozy/farben.css" />
  <link rel="stylesheet" href="../themes/cozy/raum.css" />
  <link rel="stylesheet" href="home.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--schrift, 'Inter', 'Segoe UI', Roboto, sans-serif);
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    /* Leiste = TV-Gehaeuse (Rahmen aus raum.css, Klasse rahmen-leiste-video;
       links sitzt der Lautsprecher). Der Inhalt ragt etwas in den Rahmen. */
    #bar {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
      padding: 0 2px; flex-shrink: 0;
      -webkit-app-region: drag; /* Fenster ueber Leiste ziehbar */
    }
    #bar > * { margin-top: -6px; margin-bottom: -8px; }
    #bar input, #bar button { -webkit-app-region: no-drag; }
    /* Drei Spalten: links Home, Mitte Eingabe (fix zur Fenstermitte), rechts Status/Fenster-Buttons.
       So springt die Mitte nicht, wenn der Status-Text wechselt (bereit -> live: …). */
    .bar-left { justify-self: start; min-width: 0; display: flex; align-items: center; gap: 10px; }
    .bar-center { display: flex; align-items: center; gap: 8px; justify-self: center; }
    .bar-right { display: flex; align-items: center; gap: 8px; justify-self: end; min-width: 0; }
    #channel {
      flex: 0 1 340px; min-width: 0;
      padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font-size: 14px;
    }
    #channel:focus { outline: none; border-color: var(--accent); }
    #load {
      padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 6px;
      background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer;
      font-size: 14px;
    }
    #load:hover { filter: brightness(1.15); }
    #load:disabled { opacity: .5; cursor: default; }
    #status {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    #status::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ts); flex-shrink: 0;
    }
    body.onair #status::before { background: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
    #status.err { color: #eb4034; }
    #status.err::before { background: #eb4034; box-shadow: none; }
    #status.hidden { display: none; } /* leer -> ganz weg (kein einsamer Punkt) */
    /* Leerer Player zeigt die Holzwand (Klasse tapete); der Player-iframe deckt sie. */
    #player { flex: 1; position: relative; }
    #player iframe { border: 0; }
    #hint {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; text-align: center;
      color: var(--muted); font-size: 14px; padding: 24px; pointer-events: none;
    }
    /* "Ads blocked" in der Leiste: gruene Lampe, Text in Pixel-Schrift, Zahl
       als kleines eckiges Schild. Adblock ist immer an -> dauerhaft sichtbar;
       waehrend gerade eine Werbung geblockt wird (.blocking), blinkt die Lampe. */
    #ads-indicator {
      -webkit-app-region: no-drag; font-family: var(--schrift-pixel);
      display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; user-select: none; cursor: default;
      font-size: 14px; font-weight: 700; color: var(--accent-title); text-transform: uppercase; letter-spacing: .06em;
    }
    #ads-indicator .lampe { margin: -4px -2px -4px -4px; }
    #ads-zahl { min-width: 18px; padding: 1px 6px; margin-left: 4px; font-size: 13px; text-align: center;
      background: var(--panel-fest); color: var(--accent-title); border: 2px solid var(--line); }
    #ads-zahl.hidden { display: none; }
    #ads-indicator.blocking .lampe { animation: ads-blink .8s steps(1) infinite; }
    @keyframes ads-blink { 50% { filter: brightness(.45); } }
    /* Fenster-Buttons (randloses Fenster): Pixel-Knoepfe (raum.css), ✕ warnt rot */
    #win-controls { display: flex; gap: 2px; -webkit-app-region: no-drag; margin-left: 2px; }
    #win-controls #win-close:hover { filter: saturate(2.2) hue-rotate(-22deg) brightness(1.1); }
    /* Kein Rahmen ums Fenster (Janis 09.11.2026): angedockt lagen Video- und
       Chat-Rahmen als Doppellinie nebeneinander. */
    /* Die fruehere On-Air-Linie ueber der Leiste entfaellt: ob etwas live
       laeuft, zeigt die rote Lampe an den Stream-Infos. Das Element bleibt,
       weil video.js sein Label weiter pflegt. */
    #onair-bar { display: none; }
    #status, #si-oben { font-family: var(--schrift-pixel); }
    #si-oben { font-size: 15px; letter-spacing: .03em; }
    /* Rote Lampe vor dem Profilbild, nur bei Live. */
    #si-lampe { display: none; margin: -4px -6px -4px -4px; }
    #stream-info.live #si-lampe { display: inline-block; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent-dim); outline-offset: 1px;
    }
    /* Nur-Video-Modus: Umschalt-Button in der Leiste. */
    #vollbild-btn, #video-only-btn { -webkit-app-region: no-drag; }
    #vollbild-btn.an, #video-only-btn.an { outline: 2px solid var(--accent); outline-offset: -3px; }
    /* Im Modus: alles ausser dem Player ausblenden. */
    body.video-only #bar,
    body.video-only #onair-bar { display: none; }
    body.video-only { border: none; box-shadow: none; }
    /* Schwebende Leiste oben: ziehbar (Fenster verschieben) + Verlassen-Button.
       Nur im Modus sichtbar, blendet bei Mausruhe aus. */
    #video-topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 40;
      -webkit-app-region: drag;
      display: none; align-items: center; justify-content: space-between;
      padding: 0 12px; gap: 10px;
      background: linear-gradient(rgba(0, 0, 0, .55), transparent);
      opacity: 0; transition: opacity 200ms ease;
    }
    body.video-only #video-topbar { display: flex; }
    body.video-only.controls-active #video-topbar { opacity: 1; }
    #video-topbar-hint {
      color: rgba(255, 255, 255, .8); font-size: 11px; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
    }
    #video-exit {
      -webkit-app-region: no-drag;
      background: rgba(0, 0, 0, .6); color: #fff;
      border: 1px solid rgba(255, 255, 255, .2); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    #video-exit:hover { background: rgba(0, 0, 0, .85); }
    /* Home: die Riesen-Namen liegen unter dem Home-Inhalt. */
    #home > :not(#home-version):not(#home-namen) { position: relative; z-index: 1; }
    #home > #home-namen { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    #home-title, #cd-info .cd-name, #home-namen { font-family: var(--schrift-titel, inherit); }
    /* Updater in der Leiste: Fortschritt, dann "Neu starten" als Knopf */
    #update-chip {
      padding: 3px 9px; margin-right: 6px; border-radius: 0; font: inherit; font-size: 11px;
      border: 1px solid var(--accent-border); background: var(--accent-glow); color: var(--text);
      cursor: default; white-space: nowrap; -webkit-app-region: no-drag;
    }
    #update-chip.hidden { display: none; }
    #update-chip.bereit { background: var(--accent); color: var(--accent-contrast); font-weight: 700; cursor: pointer; }
    #update-chip.bereit:hover { filter: brightness(1.1); }
    #update-chip.fehler { border-color: #eb0400; color: #ff8a80; background: transparent; }

    /* Stream-Infos in der Leiste: Name · Titel, darunter Spiel · Zuschauer · Laufzeit */
    #stream-info { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 10px; max-width: min(900px, 55vw); min-width: 0;
      background: none; border: 1px solid transparent; border-radius: 0; padding: 3px 10px 3px 4px; color: var(--text); cursor: text; text-align: left; }
    #stream-info:hover { background: var(--hover); border-color: var(--line); }
    #stream-info.hidden { display: none; }
    body.home-offen #stream-info { display: none; } /* in Home steht oben nur "Ads blocked" */
    #si-avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; background: var(--line); object-fit: cover; }
    #stream-info.live #si-avatar { box-shadow: 0 0 0 2px #e91916; }
    #si-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    #si-oben { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #si-unten { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <!-- Unsichtbar; video.js pflegt das Label weiter (Live zeigt die rote Lampe). -->
  <div id="onair-bar">
    <span id="oa-label"></span>
  </div>
  <div id="bar" class="rahmen-leiste-video">
    <div class="bar-left">
      <button id="home-btn" class="pixel-knopf k-home" title="Home: Favoriten & VODs">☰</button>
      <span id="ads-indicator" title="Werbe-Blocker aktiv"><span class="lampe gruen"></span><span>Ads blocked</span><span id="ads-zahl" class="hidden"></span></span>
    </div>
    <div class="bar-center">
      <!-- Was laeuft gerade (statt des Eingabefelds); Klick oder Strg+L -> Eingabe -->
      <button id="stream-info" type="button" class="hidden" title="Klicken (oder Strg+L): Home öffnen und Kanal wechseln">
        <span id="si-lampe" class="lampe rot"></span>
        <img id="si-avatar" alt="" />
        <span id="si-text"><span id="si-oben"></span><span id="si-unten"></span></span>
      </button>
    </div>
    <div class="bar-right">
      <button id="update-chip" class="hidden" type="button"></button>
      <span id="status">bereit</span>
      <button id="vollbild-btn" class="pixel-knopf k-teilen" title="Video + Chat bildschirmfüllend (nochmal klicken: zurück)">◫</button>
      <button id="video-only-btn" class="pixel-knopf k-vollbild" title="Nur Video (Fenster füllen)">⛶</button>
      <div id="win-controls">
        <button id="win-min" class="pixel-knopf k-min" title="Minimieren">─</button>
        <button id="win-max" class="pixel-knopf k-max" title="Maximieren/Wiederherstellen">▢</button>
        <button id="win-close" class="pixel-knopf k-zu" title="Schließen">✕</button>
      </div>
    </div>
  </div>
  <div id="video-topbar">
    <span id="video-topbar-hint">Nur-Video — Fenster hier ziehen</span>
    <button id="video-exit" title="Nur-Video verlassen">✕ Nur-Video</button>
  </div>
  <div id="player" class="tapete">
    <div id="hint">☰ Home öffnen und einen Kanal wählen.</div>
  </div>

  <!-- Home-Overlay: Favoriten (Live-Status) + VOD-Browser -->
  <div id="home" class="hidden">
    <div id="home-namen" aria-hidden="true"></div>
    <div id="home-head">
      <button id="home-back" class="hidden">← Zurück</button>
      <span id="home-title">Home</span>
      <button id="home-close" title="Schließen">✕</button>
    </div>

    <div id="auth-bar">
      <span id="auth-state">Nicht angemeldet</span>
      <button id="auth-login" type="button">Mit Twitch anmelden</button>
      <button id="auth-logout" type="button" class="hidden">Abmelden</button>
    </div>

    <div id="home-kanaele">
      <div id="home-such-zeile">
        <input id="home-suche" type="text" placeholder="Kanäle suchen (Name, Spiel, Titel) …" autocomplete="off" />
        <button id="refresh-btn" title="Aktualisieren">⟳</button>
      </div>
      <div id="home-hinweis" class="empty hidden"></div>
      <div id="home-buehne">
        <div id="cd-huelle" tabindex="0">
          <!-- Schlitten verschiebt, Flip dreht um die senkrechte Achse (Silber -> Label),
               die Seiten drehen sich selbst - drei Elemente, drei transforms. -->
          <div class="cd-schlitten"><div class="cd-flip">
            <div class="cd-seite cd-silber"><div class="cd-regenbogen"></div></div>
            <div class="cd-seite cd-label"><div class="cd-label-bild"></div></div>
          </div></div>
          <div class="cd-front"></div>
          <div class="cd-rueck"></div>
        </div>
        <div id="cd-info"></div>
        <!-- Laufwerk beim Abspielen: Schublade, CD, Terminal (home-buehne-dom.js) -->
        <div id="cd-laufwerk" class="hidden" aria-hidden="true"></div>
      </div>
      <div id="home-staender"></div>
    </div>

    <div id="home-vod-view" class="hidden">
      <div id="vod-list"></div>
    </div>

    <div id="home-version"></div>
  </div>

  <!-- Offizielle Twitch-Embed-JS-API (liefert getCurrentTime()) -->
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="../lib/stream-info.js"></script>
  <script src="../lib/ad-overlay-state.js"></script>
  <script src="../lib/theme.js"></script>
  <script src="../lib/home-liste.js"></script>
  <script src="../lib/anmeldung.js"></script>
  <script src="../lib/home-buehne.js"></script>
  <script src="../lib/home-punkte.js"></script>
  <script src="video.js"></script>
  <script src="home-buehne-dom.js"></script>
  <script src="home.js"></script>
</body>
</html>
