<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>TwitchDual — Video</title>
  <link rel="stylesheet" href="home.css" />
  <style>
    :root {
      --accent: #35e0ff;
      --accent-title: #90eeff;
      --accent-border: rgba(53, 224, 255, .4);
      --accent-glow: rgba(53, 224, 255, .2);
      --accent-dim: rgba(53, 224, 255, .3);
      --accent-contrast: #041018;
      --panel: #0e1a22;
      --onair-from: #35e0ff;
      --onair-to: #ff4fa3;
      --bg: #0b0b11;
      --line: #1c1c26;
      --hover: #14141c;
      --text: #ededf4;
      --muted: #8b8b9c;
      --ts: #565666;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--schrift, 'Inter', 'Segoe UI', Roboto, sans-serif);
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    #bar {
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
      padding: 8px; background: var(--panel);
      border-bottom: 1px solid var(--accent-border);
      -webkit-app-region: drag; /* Fenster ueber Leiste ziehbar */
    }
    #bar input, #bar button { -webkit-app-region: no-drag; }
    /* Drei Spalten: links Home, Mitte Eingabe (fix zur Fenstermitte), rechts Status/Fenster-Buttons.
       So springt die Mitte nicht, wenn der Status-Text wechselt (bereit -> live: …). */
    .bar-left { justify-self: start; min-width: 0; }
    .bar-center { display: flex; align-items: center; gap: 8px; justify-self: center; }
    .bar-right { display: flex; align-items: center; gap: 8px; justify-self: end; min-width: 0; }
    #channel {
      flex: 0 1 340px; min-width: 0;
      padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font-size: 14px;
    }
    #channel:focus { outline: none; border-color: var(--accent); }
    #load {
      padding: 8px 16px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 6px;
      background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer;
      font-size: 14px;
    }
    #load:hover { filter: brightness(1.15); }
    #load:disabled { opacity: .5; cursor: default; }
    #status {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    #status::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ts); flex-shrink: 0;
    }
    body.onair #status::before { background: var(--accent); box-shadow: 0 0 6px var(--accent-dim); }
    #status.err { color: #eb4034; }
    #status.err::before { background: #eb4034; box-shadow: none; }
    #status.hidden { display: none; } /* leer -> ganz weg (kein einsamer Punkt) */
    #player { flex: 1; position: relative; background: #000; }
    #player iframe { border: 0; }
    #hint {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; text-align: center;
      color: var(--muted); font-size: 14px; padding: 24px; pointer-events: none;
    }
    /* Leuchtpunkt "Ads blocked" in der Leiste (wo frueher der Ads-Schalter war).
       Adblock ist immer an -> dauerhaft sichtbar; pulsiert schneller (.blocking),
       waehrend gerade eine Werbung geblockt wird. */
    #ads-indicator {
      -webkit-app-region: no-drag;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted); white-space: nowrap;
      padding: 0 4px; user-select: none; cursor: default;
    }
    #ads-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
      animation: ads-pulse 2.4s ease-in-out infinite;
    }
    #ads-indicator.blocking { color: var(--accent-title); }
    #ads-indicator.blocking #ads-dot { animation-duration: .7s; }
    @keyframes ads-pulse {
      0%, 100% { box-shadow: 0 0 5px 0 var(--accent-dim), 0 0 2px var(--accent); opacity: .8; }
      50%      { box-shadow: 0 0 11px 2px var(--accent), 0 0 3px var(--accent); opacity: 1; }
    }
    #bar button:active { transform: scale(.96); }
    #bar button { transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease; }
    /* Fenster-Buttons (randloses Fenster): dezent, ✕ warnt rot */
    #win-controls { display: flex; gap: 2px; -webkit-app-region: no-drag; margin-left: 2px; }
    #win-controls button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 7px 10px; border-radius: 6px; line-height: 1;
      transition: background-color 120ms ease, color 120ms ease;
    }
    #win-controls button:hover { background: var(--hover); color: var(--text); }
    #win-controls #win-close:hover { background: #eb0400; color: #fff; }
    body {
      border: 1px solid var(--accent-border);
      box-shadow: inset 0 0 24px -12px var(--accent-glow);
    }
    #onair-bar {
      display: flex; align-items: center; gap: 10px; height: 16px;
      padding: 0 12px; flex-shrink: 0;
    }
    #onair-bar .oa-line {
      flex: 1; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--onair-from), var(--onair-to));
      opacity: .22;
    }
    body.onair #onair-bar .oa-line {
      opacity: 1; box-shadow: 0 0 8px var(--accent-glow);
      animation: onair-pulse 3.6s ease-in-out infinite;
    }
    @keyframes onair-pulse { 50% { opacity: .55; } }
    #oa-label {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .14em; white-space: nowrap;
      background: linear-gradient(90deg, var(--onair-from), var(--onair-to));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transition: opacity .25s;
    }
    body.onair #oa-label { opacity: 1; }
    #status { font-family: var(--mono); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent-dim); outline-offset: 1px;
    }
    /* Nur-Video-Modus: Umschalt-Button in der Leiste. */
    #vollbild-btn, #video-only-btn {
      -webkit-app-region: no-drag;
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 14px; padding: 6px 8px; border-radius: 6px; line-height: 1;
      transition: background-color 120ms ease, color 120ms ease;
    }
    #vollbild-btn:hover, #video-only-btn:hover { background: var(--hover); color: var(--text); }
    #vollbild-btn.an, #video-only-btn.an { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: 0 0 10px var(--accent-border), inset 0 0 0 1px var(--accent-border); }
    /* Im Modus: alles ausser dem Player ausblenden. */
    body.video-only #bar,
    body.video-only #onair-bar { display: none; }
    body.video-only { border: none; box-shadow: none; }
    /* Schwebende Leiste oben: ziehbar (Fenster verschieben) + Verlassen-Button.
       Nur im Modus sichtbar, blendet bei Mausruhe aus. */
    #video-topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 40;
      -webkit-app-region: drag;
      display: none; align-items: center; justify-content: space-between;
      padding: 0 12px; gap: 10px;
      background: linear-gradient(rgba(0, 0, 0, .55), transparent);
      opacity: 0; transition: opacity 200ms ease;
    }
    body.video-only #video-topbar { display: flex; }
    body.video-only.controls-active #video-topbar { opacity: 1; }
    #video-topbar-hint {
      color: rgba(255, 255, 255, .8); font-size: 11px; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
    }
    #video-exit {
      -webkit-app-region: no-drag;
      background: rgba(0, 0, 0, .6); color: #fff;
      border: 1px solid rgba(255, 255, 255, .2); border-radius: 6px;
      padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    #video-exit:hover { background: rgba(0, 0, 0, .85); }
    /* Lebendige Themes: Home-Ebene liegt unter dem Home-Inhalt, Gast-Ebene
       ueber dem Player. Beide fangen nie einen Klick ab. */
    .fx-ebene { pointer-events: none; overflow: hidden; }
    /* NUR waehrend eines Auftritts sichtbar: liegt sie dauerhaft ueber dem
       Player, gilt er fuer Twitch als verdeckt und startet nicht von selbst
       (Play-Knopf bleibt stehen; 2026-10-07 gemessen). */
    #fx-gast { position: fixed; inset: 0; z-index: 30; display: none; }
    #fx-gast.aktiv { display: block; }
    #home > #fx-hinten { position: absolute; inset: 0; z-index: 0; }
    #home > :not(#fx-hinten):not(.theme-deko):not(#home-version) { position: relative; z-index: 1; }
    #home > .theme-deko { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    #home-title, .lc-name, .fav .name { font-family: var(--schrift-titel, inherit); }
    body.video-only #fx-gast { display: none; }
    /* Updater in der Leiste: Fortschritt, dann "Neu starten" als Knopf */
    #update-chip {
      padding: 3px 9px; margin-right: 6px; border-radius: 999px; font: inherit; font-size: 11px;
      border: 1px solid var(--accent-border); background: var(--accent-glow); color: var(--text);
      cursor: default; white-space: nowrap; -webkit-app-region: no-drag;
    }
    #update-chip.hidden { display: none; }
    #update-chip.bereit { background: var(--accent); color: var(--accent-contrast); font-weight: 700; cursor: pointer; }
    #update-chip.bereit:hover { filter: brightness(1.1); }
    #update-chip.fehler { border-color: #eb0400; color: #ff8a80; background: transparent; }

  </style>
</head>
<body>
  <!-- Gastauftritte: einzelne Partikel quer uebers Video, nie klickbar. -->
  <div id="fx-gast" class="fx-ebene"></div>
  <div id="onair-bar">
    <span class="oa-line"></span>
    <span id="oa-label">● ON AIR</span>
  </div>
  <div id="bar">
    <div class="bar-left">
      <button id="home-btn" title="Home: Favoriten & VODs">☰</button>
    </div>
    <div class="bar-center">
      <input id="channel" type="text" placeholder="Channel (live) oder VOD-Link/ID …" autocomplete="off" list="history" />
      <datalist id="history"></datalist>
      <button id="load">Laden</button>
      <span id="ads-indicator" title="Werbe-Blocker aktiv"><span id="ads-dot"></span>Ads blocked</span>
    </div>
    <div class="bar-right">
      <button id="update-chip" class="hidden" type="button"></button>
      <span id="status">bereit</span>
      <button id="vollbild-btn" title="Video + Chat bildschirmfüllend (nochmal klicken: zurück)">◫</button>
      <button id="video-only-btn" title="Nur Video (Fenster füllen)">⛶</button>
      <div id="win-controls">
        <button id="win-min" title="Minimieren">─</button>
        <button id="win-max" title="Maximieren/Wiederherstellen">▢</button>
        <button id="win-close" title="Schließen">✕</button>
      </div>
    </div>
  </div>
  <div id="video-topbar">
    <span id="video-topbar-hint">Nur-Video — Fenster hier ziehen</span>
    <button id="video-exit" title="Nur-Video verlassen">✕ Nur-Video</button>
  </div>
  <div id="player">
    <div id="hint">Channel-Name für LIVE oder VOD-Link/ID eingeben und „Laden" drücken — oder ☰ Home für Favoriten.</div>
  </div>

  <!-- Home-Overlay: Favoriten (Live-Status) + VOD-Browser -->
  <div id="home" class="hidden">
    <div id="fx-hinten" class="fx-ebene"></div>
    <div class="theme-deko" aria-hidden="true"></div>
    <div id="home-head">
      <button id="home-back" class="hidden">← Zurück</button>
      <span id="home-title">Home</span>
      <button id="home-close" title="Schließen">✕</button>
    </div>

    <div id="auth-bar">
      <span id="auth-state">Nicht angemeldet</span>
      <button id="auth-login" type="button">Mit Twitch anmelden</button>
      <button id="auth-logout" type="button" class="hidden">Abmelden</button>
    </div>

    <div id="home-kanaele">
      <div id="home-such-zeile">
        <input id="home-suche" type="text" placeholder="Kanäle suchen (Name, Spiel, Titel) …" autocomplete="off" />
        <button id="refresh-btn" title="Aktualisieren">⟳</button>
      </div>
      <div id="home-hinweis" class="empty hidden"></div>
      <div id="home-liste"></div>
    </div>

    <div id="home-vod-view" class="hidden">
      <div id="vod-list"></div>
    </div>

    <div id="home-version"></div>
  </div>

  <!-- Offizielle Twitch-Embed-JS-API (liefert getCurrentTime()) -->
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="../lib/ad-overlay-state.js"></script>
  <script src="../lib/theme.js"></script>
  <script src="../lib/themes.js"></script>
  <script src="../lib/fx-engine.js"></script>
  <script src="../lib/theme-runtime.js"></script>
  <script src="../lib/home-abschnitte.js"></script>
  <script src="../lib/home-liste.js"></script>
  <script src="../lib/anmeldung.js"></script>
  <script src="video.js"></script>
  <script src="home.js"></script>
</body>
</html>
